<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72" fill="none" role="img" aria-label="LDS Infrastructure - Lukhdatar &amp; Sons">
  <defs>
    <linearGradient id="bolt-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A843"/>
      <stop offset="50%" stop-color="#C9A052"/>
      <stop offset="100%" stop-color="#B8892E"/>
    </linearGradient>
    <linearGradient id="letter-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A2F36"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>
  </defs>

  <!-- L letter -->
  <rect x="0" y="2" width="9" height="40" fill="url(#letter-grad)"/>
  <rect x="0" y="33" width="22" height="9" fill="url(#letter-grad)"/>

  <!-- D letter -->
  <rect x="28" y="2" width="9" height="40" fill="url(#letter-grad)"/>
  <path d="M28 2 H44 Q60 2 60 22 Q60 42 44 42 H28 Z" fill="url(#letter-grad)"/>
  <path d="M37 10 H43 Q52 10 52 22 Q52 34 43 34 H37 Z" fill="#FAF8F5" opacity="0.08"/>

  <!-- S letter (base shape) -->
  <path d="M66 2 H88 Q94 2 94 10 Q94 18 88 18 H72 Q66 18 66 26 Q66 34 72 34 H94 Q94 42 88 42 H66 Q60 42 60 34 Q60 26 66 26 H80 Q86 26 86 18 Q86 10 80 10 H60 Q60 2 66 2 Z" fill="url(#letter-grad)"/>

  <!-- Lightning bolt — gold accent, diagonal through LDS -->
  <polygon
    points="44,2 52,2 38,20 46,20 30,42 22,42 36,24 28,24"
    fill="url(#bolt-gold)"
    opacity="0.95"
  />

  <!-- LUKHDATAR & SONS full name -->
  <text
    x="0"
    y="56"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="8"
    font-weight="700"
    letter-spacing="2.2"
    fill="currentColor"
    opacity="0.90"
  >LUKHDATAR &amp; SONS</text>

  <!-- Gold rule lines around subtitle -->
  <rect x="0" y="61" width="18" height="0.8" fill="#C9A052" opacity="0.75"/>
  <rect x="152" y="61" width="18" height="0.8" fill="#C9A052" opacity="0.75"/>

  <!-- LDS INFRASTRUCTURE PVT. LTD. -->
  <text
    x="22"
    y="62"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="5.5"
    font-weight="500"
    letter-spacing="1.8"
    fill="#C9A052"
    opacity="0.95"
  >LDS INFRASTRUCTURE PVT. LTD.</text>

  <!-- ENGINEERING · EQUIPMENT · EXECUTION -->
  <text
    x="0"
    y="72"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="5"
    font-weight="400"
    letter-spacing="1.6"
    fill="currentColor"
    opacity="0.45"
  >ENGINEERING  •  EQUIPMENT  •  EXECUTION</text>
</svg>
